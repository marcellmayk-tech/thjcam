<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THJcam</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="THJcam">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c0c">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
/* Layout: one camera screen. Viewfinder fills the middle, status + shutter at the bottom. Single dark theme by choice. */
:root{
  --bg:#0b0c0c; --panel:#191c1c; --ink:#f1f3f2; --muted:#a3aba7; --line:#343a39;
  --accent:#f2c200; --on-accent:#141615; --ok:#63cf99; --warn:#f3a556;
  --display:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em}
.brand b{color:var(--accent)}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;min-height:40px;padding:6px 14px;font:inherit;font-weight:600}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.stage canvas,.stage img{width:100%;height:100%;object-fit:contain;display:block}
.stage img{-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.notice{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:24px;text-align:center;background:var(--bg)}
.notice h2{font-family:var(--display);font-size:26px;margin:0;text-wrap:balance}
.notice p{margin:0;color:var(--muted);max-width:34ch}
.bottom{display:flex;flex-direction:column;gap:10px;padding:10px 16px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:28px}
.chip{font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid currentColor}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.info{color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:center;gap:12px;min-height:76px}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid var(--ink);background:var(--accent);padding:0;
  box-shadow:inset 0 0 0 3px var(--bg)}
.shutter:active{transform:scale(.94)}
.shutter:disabled{opacity:.4}
.btn{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;
  min-height:54px;padding:8px 18px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);flex:1}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.msg{margin:0;text-align:center;color:var(--warn);font-size:14px;font-weight:600}
.msg:empty{display:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;-webkit-user-select:auto;user-select:auto;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));z-index:5}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-family:var(--display);font-size:26px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-weight:600;font-size:15px}
.field input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;width:100%}
.hint{margin:0;color:var(--muted);font-size:14px}
.small{font:inherit;font-weight:600;min-height:42px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:inline-flex;align-items:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.colors{display:flex;gap:20px;flex-wrap:wrap}
.colors label{display:flex;align-items:center;gap:8px;font-weight:500}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #000;display:inline-block}
@media (orientation:landscape) and (max-height:500px){
  .top{position:absolute;z-index:2;left:0;right:0;padding-top:calc(6px + env(safe-area-inset-top))}
  body{flex-direction:row}
  .bottom{width:150px;justify-content:center}
  .bar{flex-direction:column}
}
</style>
</head>
<body>
  <div class="top">
    <span class="brand">THJ<b>cam</b></span>
    <button class="icon-btn" type="button" id="abrirCfg">Ajustes</button>
  </div>

  <div class="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="visor" width="1280" height="720" aria-label="Câmera com o carimbo"></canvas>
    <img id="resultado" alt="Foto carimbada" hidden>
    <div class="notice" id="aviso" hidden>
      <h2 id="avisoT"></h2>
      <p id="avisoP"></p>
      <button class="btn primary" type="button" id="avisoB" style="flex:none" hidden>Tentar de novo</button>
    </div>
  </div>

  <div class="bottom">
    <div class="chips" id="chips"></div>
    <p class="msg" id="msg" role="status"></p>
    <div class="bar" id="barLive">
      <button class="shutter" type="button" id="disparo" aria-label="Tirar foto" disabled></button>
    </div>
    <div class="bar" id="barShot" hidden>
      <button class="btn" type="button" id="nova">Nova foto</button>
      <button class="btn primary" type="button" id="salvar">Salvar</button>
    </div>
  </div>

  <div class="sheet" id="cfg" hidden>
    <div class="sheet-in">
      <h2>Ajustes</h2>
      <p class="hint">Preencha uma vez. Fica guardado neste aparelho.</p>
      <div class="field">
        <label for="obra">Obra, contrato ou km (opcional)</label>
        <input type="text" id="obra" autocomplete="off" placeholder="Obra BR 267 - Km 88,68">
        <p class="hint">Sai como primeira linha do carimbo. Deixe em branco se não quiser.</p>
      </div>
      <div class="field">
        <span class="lab">Cor das letras</span>
        <div class="colors">
          <label><input type="radio" name="cor" id="corA" value="#FFE600"><span class="sw" style="background:#FFE600"></span>Amarelo</label>
          <label><input type="radio" name="cor" id="corB" value="#FFFFFF"><span class="sw" style="background:#FFFFFF"></span>Branco</label>
        </div>
      </div>
      <button class="btn primary" type="button" id="fecharCfg" style="flex:none">Voltar para a câmera</button>
    </div>
  </div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var KEY="thjcam-v1";
var st={obra:"",cor:"#FFE600",lastAddr:"",lastAddrAt:null};
var MARCA="THJ";
var SUB=["CONTROLE FOTOGRÁFICO","THJ CONSTRUÇÕES E SERVIÇOS LTDA"];
try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s==="object"){for(var k in st){if(s[k]!=null)st[k]=s[k]}}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

var video=$("video"),cv=$("visor"),ctx=cv.getContext("2d");
var mode="live",stream=null,outBlob=null,outUrl=null,outName="";
var pos=null,gpsState="wait"; // wait | ok | denied | off
var addr="",addrAt=null,addrBusy=false,addrLast=0,addrFail=false;

/* ---------- helpers ---------- */
function p2(n){return(n<10?"0":"")+n}
function fmtCoord(n){return n.toFixed(5).replace(".",",")}
function fmtDate(d){return p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()+" "+p2(d.getHours())+":"+p2(d.getMinutes())}
function dist(a,b){var R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;
  var h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);
  return 2*R*Math.asin(Math.sqrt(h))}
function say(t){$("msg").textContent=t||""}
function loadImage(src){return new Promise(function(ok,no){var i=new Image();i.onload=function(){ok(i)};i.onerror=no;i.src=src})}

/* ---------- stamp ---------- */
function outlined(c,text,x,y,fs,fill){
  c.lineJoin="round";c.lineWidth=Math.max(2,fs*0.17);c.strokeStyle="rgba(0,0,0,.85)";
  c.strokeText(text,x,y);c.fillStyle=fill;c.fillText(text,x,y);
}
function drawStamp(c,W,H,d){
  var base=Math.min(W,H),m=Math.round(base*0.022),fs=Math.round(base*0.042);
  var face="px Arial, Helvetica, sans-serif";
  var lines=d.lines.filter(Boolean);
  c.textBaseline="alphabetic";
  if(lines.length){
    c.textAlign="left";
    var maxW=W-2*m,lh=fs*1.3,y=H-m-fs*0.22-base*0.06-(lines.length-1)*lh;
    lines.forEach(function(l,i){
      var f=fs;c.font="bold "+f+face;var w=c.measureText(l).width;
      if(w>maxW){f=Math.max(10,Math.floor(f*maxW/w));c.font="bold "+f+face}
      outlined(c,l,m,y+i*lh,f,d.cor);
    });
  }
  /* marca THJ: preta, Montserrat 900, 30% mais larga, letras com um espacinho */
  var ns=Math.round(base*0.088),mface="px 'Montserrat','Arial Black',Arial,sans-serif";
  c.font="900 "+ns+mface;c.textAlign="right";c.fillStyle="#000000";
  var chs=Array.from(MARCA),gap=ns*0.03,mx=0,my=m+ns;
  c.save();c.translate(W-m-ns*0.12,0);c.scale(1.3,1);
  for(var ci=chs.length-1;ci>=0;ci--){c.fillText(chs[ci],mx,my);mx-=c.measureText(chs[ci]).width+gap}
  c.restore();
  /* dizeres embaixo da marca, alinhados à direita com ela; tamanho próprio (legível na tela do celular), até 62% da largura da foto */
  var tw=W*0.62,cx=W-m-ns*0.12,ss=Math.round(base*0.034);
  c.font="italic bold "+ss+face;c.textAlign="right";
  var sw=0;SUB.forEach(function(l){sw=Math.max(sw,c.measureText(l).width)});
  if(sw>tw){ss=Math.max(8,ss*tw/sw);c.font="italic bold "+ss+face}
  c.fillStyle="#000000";
  SUB.forEach(function(l,i){c.fillText(l,cx,my+ss*1.3+i*ss*1.15)});
}
function collect(now){
  var coord="";
  if(pos){coord=fmtCoord(pos.lat)+"/"+fmtCoord(pos.lon);if(pos.acc!=null)coord+="  (±"+Math.round(pos.acc)+" m)"}
  var a=(pos&&addr&&addrAt&&dist(pos,addrAt)<300)?addr:"";
  return{lines:[st.obra,a,coord,fmtDate(now)],cor:st.cor};
}

/* ---------- address from coordinates (OpenStreetMap) ---------- */
function partsAddr(j){
  var a=(j&&j.address)||{};
  return{road:a.road||a.pedestrian||a.footway||a.path||a.cycleway||"",
    bairro:a.suburb||a.neighbourhood||a.quarter||a.hamlet||"",
    city:a.city||a.town||a.village||a.municipality||a.county||"",
    uf:(a["ISO3166-2-lvl4"]||"").split("-")[1]||a.state||""};
}
function joinAddr(p){
  var left=[p.road,p.bairro].filter(Boolean).join(", ");
  var right=p.city?(p.city+(p.uf?" ("+p.uf+")":"")):p.uf;
  return [left,right].filter(Boolean).join(" - ");
}
function formatAddr(j){return joinAddr(partsAddr(j))}
window.__formatAddr=formatAddr;
/* Bairro: o mapa livre erra o bairro perto das divisas. Confere a rua nos Correios (ViaCEP)
   e usa o bairro de lá quando a rua aparece em um único bairro da cidade. */
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
var TIPOS=/^(rua|avenida|travessa|alameda|estrada|praca|rodovia|largo|beco|viela|ladeira|via)\s+/;
function semTipo(s){return norm(s).replace(TIPOS,"")}
var bairroCache={};
function bairroCorreios(p){
  if(!p.road||!p.city||!/^[A-Z]{2}$/.test(p.uf))return Promise.resolve("");
  var nome=p.road.replace(/^(rua|avenida|travessa|alameda|estrada|praça|praca|rodovia|largo|beco|viela|ladeira|via)\s+/i,"").trim();
  if(nome.length<3)return Promise.resolve("");
  var key=p.uf+"|"+p.city+"|"+p.road;
  if(key in bairroCache)return Promise.resolve(bairroCache[key]);
  var ctl=("AbortController" in window)?new AbortController():null;
  if(ctl)setTimeout(function(){ctl.abort()},6000);
  var url="https://viacep.com.br/ws/"+p.uf+"/"+encodeURIComponent(p.city)+"/"+encodeURIComponent(nome)+"/json/";
  return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(list){
    if(!Array.isArray(list))return "";
    var alvo=norm(p.road),alvo2=semTipo(p.road),exato={},solto={};
    list.forEach(function(x){
      if(!x||!x.bairro)return;
      if(norm(x.logradouro)===alvo)exato[x.bairro]=1;
      if(semTipo(x.logradouro)===alvo2)solto[x.bairro]=1;
    });
    var ks=Object.keys(exato);if(!ks.length)ks=Object.keys(solto);
    var b=ks.length===1?ks[0]:"";
    bairroCache[key]=b;return b;
  }).catch(function(){return ""});
}
function geocode(){
  if(!pos||addrBusy)return;
  var now=Date.now();
  if(now-addrLast<4000)return;
  if(addrAt&&dist(pos,addrAt)<40&&addr)return;
  addrBusy=true;addrLast=now;var at={lat:pos.lat,lon:pos.lon};
  var url="https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=pt-BR&lat="+at.lat+"&lon="+at.lon;
  fetch(url,{headers:{"Accept":"application/json"}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    var p=partsAddr(j);
    return bairroCorreios(p).then(function(b){if(b)p.bairro=b;return joinAddr(p)});
  }).then(function(t){
    if(t){addr=t;addrAt=at;addrFail=false;st.lastAddr=t;st.lastAddrAt=at;persist()}else{addrFail=true}
  }).catch(function(){addrFail=true}).then(function(){addrBusy=false;chips()});
}
window.__bairroCorreios=bairroCorreios;
if(st.lastAddr&&st.lastAddrAt){addr=st.lastAddr;addrAt=st.lastAddrAt}

/* ---------- GPS ---------- */
function startGps(){
  if(!("geolocation" in navigator)){gpsState="off";chips();return}
  navigator.geolocation.watchPosition(function(p){
    pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};gpsState="ok";geocode();chips();
  },function(e){
    if(e&&e.code===1){gpsState="denied";pos=null}else if(!pos){gpsState="wait"}
    chips();
  },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function chips(){
  var box=$("chips");box.textContent="";
  function add(cls,t){var e=document.createElement("span");e.className="chip "+cls;e.textContent=t;box.appendChild(e)}
  if(mode==="shot")return;
  if(gpsState==="ok"&&pos)add(pos.acc!=null&&pos.acc>50?"warn":"ok","GPS ±"+Math.round(pos.acc||0)+" m");
  else if(gpsState==="denied")add("warn","Localização bloqueada. Libere nos Ajustes do iPhone.");
  else if(gpsState==="off")add("warn","Este aparelho não informa a localização");
  else add("info","Procurando GPS…");
  if(pos){
    if(addr&&addrAt&&dist(pos,addrAt)<300)add("ok","Endereço encontrado");
    else if(addrFail)add("warn","Sem endereço (sem internet?)");
    else add("info","Buscando endereço…");
  }
}

/* ---------- camera ---------- */
function notice(t,p,retry){$("avisoT").textContent=t;$("avisoP").textContent=p;$("avisoB").hidden=!retry;$("aviso").hidden=false;$("disparo").disabled=true}
function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    notice("A câmera não abre daqui","O THJcam precisa estar publicado num endereço https e aberto no Safari. Aberto como arquivo, o iPhone bloqueia a câmera e o GPS.",false);return;
  }
  navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}}).then(function(s){
    stream=s;video.srcObject=s;$("aviso").hidden=true;
    var pl=video.play();if(pl&&pl.catch)pl.catch(function(){});
    $("disparo").disabled=false;
  }).catch(function(e){
    var denied=e&&(e.name==="NotAllowedError"||e.name==="SecurityError");
    notice(denied?"Câmera bloqueada":"Não consegui abrir a câmera",
      denied?"Libere a câmera para este site: Ajustes do iPhone, Safari, Câmera, Permitir. Depois toque em Tentar de novo.":"Feche outros apps que estejam usando a câmera e toque em Tentar de novo.",true);
  });
}
function camAlive(){return stream&&stream.getVideoTracks().some(function(t){return t.readyState==="live"})}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&mode==="live"&&!camAlive())startCam();
});
$("avisoB").addEventListener("click",startCam);

function paint(){
  var W=video.videoWidth,H=video.videoHeight;
  if(!W||!H||video.readyState<2)return false;
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  ctx.drawImage(video,0,0,W,H);
  drawStamp(ctx,W,H,collect(new Date()));
  return true;
}
function loop(){
  if(mode==="live"&&!document.hidden&&$("cfg").hidden)paint();
  requestAnimationFrame(loop);
}

/* ---------- shoot / save ---------- */
$("disparo").addEventListener("click",function(){
  if(mode!=="live")return;
  if(!paint()){say("A câmera ainda está abrindo. Tente de novo.");return}
  say("");mode="shot";
  var d=new Date();
  outName="THJcam-"+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+"-"+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds())+".jpg";
  cv.toBlob(function(b){
    if(!b){mode="live";say("Não consegui gerar a foto. Tente de novo.");return}
    outBlob=b;if(outUrl)URL.revokeObjectURL(outUrl);outUrl=URL.createObjectURL(b);
    $("resultado").src=outUrl;$("resultado").hidden=false;cv.hidden=true;
    $("barLive").hidden=true;$("barShot").hidden=false;chips();
    if(!pos)say("Esta foto saiu sem coordenadas: o GPS ainda não tinha respondido.");
  },"image/jpeg",0.93);
});
$("nova").addEventListener("click",function(){
  mode="live";say("");$("resultado").hidden=true;cv.hidden=false;
  $("barShot").hidden=true;$("barLive").hidden=false;chips();
  if(!camAlive())startCam();
});
$("salvar").addEventListener("click",function(){
  if(!outBlob)return;
  var file;try{file=new File([outBlob],outName,{type:"image/jpeg"})}catch(e){file=null}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(function(e){
      if(e&&e.name==="AbortError")return;
      say("Não deu para salvar por aqui. Segure o dedo sobre a foto e toque em Salvar em Fotos.");
    });
    return;
  }
  try{var a=document.createElement("a");a.href=outUrl;a.download=outName;document.body.appendChild(a);a.click();a.remove()}
  catch(e){say("Segure o dedo sobre a foto e toque em Salvar em Fotos.")}
});

/* ---------- settings ---------- */
$("abrirCfg").addEventListener("click",function(){$("cfg").hidden=false});
$("fecharCfg").addEventListener("click",function(){$("cfg").hidden=true});
["obra"].forEach(function(id){
  $(id).value=st[id];
  $(id).addEventListener("input",function(){st[id]=$(id).value.trim();persist()});
});
[$("corA"),$("corB")].forEach(function(r){
  r.checked=(r.value===st.cor);
  r.addEventListener("change",function(){if(r.checked){st.cor=r.value;persist()}});
});
if(!$("corA").checked&&!$("corB").checked)$("corA").checked=true;
/* ---------- start ---------- */
try{document.fonts.load("900 40px Montserrat")}catch(e){}
ctx.fillStyle="#000";ctx.fillRect(0,0,cv.width,cv.height);
chips();startCam();startGps();requestAnimationFrame(loop);
setInterval(function(){if(pos&&mode==="live")geocode()},6000);
})();
</script>
</body>
</html>
